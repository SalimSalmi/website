<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Secret Santa Selector</title>
        <style>
        html, body{
            height: 100%;
            width:100%;
            font-size: 1.1em;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        body>*{
            text-align: center;
        }
        #receivers {
            margin-top: 10px;
            list-style-type: none;
            padding: 0;
        }
        select{
            font-size:1.1em;
        }
        </style>
    </head>
    <body>
        <h1>Secret (new years) Santa</h1>
        <label for="giverSelect">Select your name:</label>
        <select id="giverSelect">
            <!-- Options will be dynamically populated -->
        </select>
        <ul id="receivers">
            <!-- Receivers will be dynamically displayed here -->
        </ul>

        <script>
        // Example result object from the Secret Santa script
        const result = [
            { giver: 'Salim', receiver: 'Emmi' },
            { giver: 'Salim', receiver: 'Majid' },
            { giver: 'Salim', receiver: 'Alice' },
            { giver: 'Tingting', receiver: 'Alice' },
            { giver: 'Tingting', receiver: 'Oma' },
            { giver: 'Tingting', receiver: 'Chadi' },
            { giver: 'Chadi', receiver: 'Majid' },
            { giver: 'Chadi', receiver: 'Alice' },
            { giver: 'Chadi', receiver: 'Oma' },
            { giver: 'Emmi', receiver: 'Majid' },
            { giver: 'Emmi', receiver: 'Tingting' },
            { giver: 'Emmi', receiver: 'Oma' },
            { giver: 'Majid', receiver: 'Emmi' },
            { giver: 'Majid', receiver: 'Salim' },
            { giver: 'Majid', receiver: 'Rayan' },
            { giver: 'Alice', receiver: 'Salim' },
            { giver: 'Alice', receiver: 'Emmi' },
            { giver: 'Alice', receiver: 'Rayan' },
            { giver: 'Rayan', receiver: 'Salim' },
            { giver: 'Rayan', receiver: 'Chadi' },
            { giver: 'Rayan', receiver: 'Tingting' },
            { giver: 'Oma', receiver: 'Tingting' },
            { giver: 'Oma', receiver: 'Rayan' },
            { giver: 'Oma', receiver: 'Chadi' }
        ]
        // Populate the <select> dropdown
        const giverSelect = document.getElementById('giverSelect');
        const receiversList = document.getElementById('receivers');

        const givers = [...new Set(result.map(r => r.giver))]; // Unique givers

        givers.forEach(giver => {
            const option = document.createElement('option');
            option.value = giver;
            option.textContent = giver;
            giverSelect.appendChild(option);
        });

        // Event listener for <select> changes
        giverSelect.addEventListener('change', () => {
            const selectedGiver = giverSelect.value;

            // Clear the current list of receivers
            receiversList.innerHTML = '';

            // Find and display receivers for the selected giver
            const receivers = result.filter(r => r.giver === selectedGiver).map(r => r.receiver);
            receivers.forEach(receiver => {
                const li = document.createElement('li');
                li.textContent = receiver;
                receiversList.appendChild(li);
            });
        });

        // Initialize the list with the first giver's receivers
        // giverSelect.dispatchEvent(new Event('change'));
        </script>
    </body>
</html>
